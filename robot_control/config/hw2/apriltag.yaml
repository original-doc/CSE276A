# Parameters for the apt apriltag_ros 3.4.0 node (only map tags are tracked).
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.156   # printed black square; 0.166 in the PDF came out ~6 % smaller (ranges were 1.06x long, 2026-11-06)
    max_hamming: 0
    detector:
      threads: 2
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp
    tag:
      ids: [0, 1, 2]
      frames: [tag_0, tag_1, tag_2]
      sizes: [0.156, 0.156, 0.156]
